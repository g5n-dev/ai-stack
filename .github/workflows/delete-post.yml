name: Delete Post

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single: delete one post by path; scan: LLM-moderate and delete"
        required: false
        default: scan
        type: choice
        options: [single, scan]
      post_path:
        description: "Relative path under blog/content/posts"
        required: false
        type: string
      scan_limit:
        description: "How many latest posts to scan"
        required: false
        default: "80"
        type: string
      dry_run:
        description: "Only validate the exact deletion plan"
        required: false
        default: true
        type: boolean

concurrency:
  group: delete-post-main
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact main base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Analyze deletion without repository write permission
        env:
          MODE: ${{ inputs.mode }}
          POST_PATH: ${{ inputs.post_path }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          import yaml

          mode = (os.environ.get("MODE") or "scan").strip()
          dry_run = (os.environ.get("DRY_RUN") or "true").lower() == "true"
          if mode not in {"single", "scan"}:
              raise SystemExit("invalid deletion mode")

          def safe_post(raw: str) -> str:
              path = PurePosixPath(raw)
              if (
                  path.is_absolute()
                  or len(path.parts) != 4
                  or path.parts[:3] != ("blog", "content", "posts")
                  or path.suffix != ".md"
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise SystemExit("invalid post path")
              candidate = path.as_posix()
              if subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", candidate],
                  capture_output=True,
              ).returncode != 0:
                  raise SystemExit("post is not tracked at the approved base")
              return candidate

          paths: list[str] = []
          if mode == "single":
              paths = [safe_post(os.environ.get("POST_PATH") or "")]
          else:
              try:
                  limit = int(os.environ.get("SCAN_LIMIT") or "80")
              except ValueError as exc:
                  raise SystemExit("scan limit must be an integer") from exc
              if not 1 <= limit <= 500:
                  raise SystemExit("scan limit must be between 1 and 500")
              from processor.anthropic_client import AnthropicClient
              from processor.ai_filter import AIThemeFilter

              config_path = Path("config/anthropic.yaml")
              config = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
              client = AnthropicClient(str(config_path))
              settings = ((config.get("anthropic") or {}).get("ai_filter") or {})
              moderation = AIThemeFilter(client, settings)
              candidates = subprocess.check_output(
                  ["git", "ls-files", "blog/content/posts/*.md"], text=True
              ).splitlines()
              for raw in sorted(candidates, reverse=True)[:limit]:
                  path = Path(raw)
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  parts = text.split("\n---\n", 1)
                  frontmatter = {}
                  body = text
                  if len(parts) == 2 and text.startswith("---"):
                      frontmatter = yaml.safe_load(parts[0].lstrip("-").strip()) or {}
                      body = parts[1]
                  summary = re.sub(r"\s+", " ", body.strip())[:900]
                  item = {
                      "source": str(frontmatter.get("source") or ""),
                      "title": str(frontmatter.get("title") or ""),
                      "description": str(frontmatter.get("description") or ""),
                      "summary": summary,
                      "tags": frontmatter.get("tags") or [],
                      "categories": frontmatter.get("categories") or [],
                      "url": str(frontmatter.get("external_url") or ""),
                  }
                  result = moderation.moderate(moderation.filter(item))
                  if not bool(result.get("should_publish", True)) or not bool(
                      result.get("ai_related", True)
                  ):
                      paths.append(safe_post(raw))

          plan = {
              "schema_version": "delete_post_plan_v1",
              "base_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "dry_run": dry_run,
              "mode": mode,
              "paths": sorted(set(paths)),
          }
          output = Path("/tmp/delete-plan/state/deletion-plan.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"deletion analysis completed: candidates={len(plan['paths'])}")
          PY
          python3 scripts/artifact_guard.py pack \
            --profile receipt \
            --root /tmp/delete-plan \
            --archive /tmp/delete-plan.tar \
            --manifest /tmp/delete-plan.manifest.json

      - name: Upload hashed deletion plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delete-plan-${{ github.run_id }}
          path: |
            /tmp/delete-plan.tar
            /tmp/delete-plan.manifest.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  writer:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: data-deletion
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main for exact-base writer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install writer dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download untrusted deletion plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: delete-plan-${{ github.run_id }}
          path: /tmp/download-delete-plan

      - name: Validate plan hashes and exact base
        id: plan
        run: |
          set -euo pipefail
          python3 scripts/artifact_guard.py validate \
            --profile receipt \
            --archive /tmp/download-delete-plan/delete-plan.tar \
            --manifest /tmp/download-delete-plan/delete-plan.manifest.json \
            --extract-to /tmp/approved-delete-plan
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          plan = json.loads(
              Path("/tmp/approved-delete-plan/state/deletion-plan.json").read_text()
          )
          if set(plan) != {"schema_version", "base_sha", "dry_run", "mode", "paths"}:
              raise SystemExit("deletion plan schema mismatch")
          if plan["schema_version"] != "delete_post_plan_v1":
              raise SystemExit("unsupported deletion plan")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if plan["base_sha"] != head or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("deletion plan base is stale")
          if not isinstance(plan["paths"], list) or len(plan["paths"]) > 500:
              raise SystemExit("deletion path count is invalid")
          for raw in plan["paths"]:
              path = PurePosixPath(raw)
              if (
                  not isinstance(raw, str)
                  or len(path.parts) != 4
                  or path.parts[:3] != ("blog", "content", "posts")
                  or path.suffix != ".md"
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise SystemExit("unsafe deletion path")
              if not Path(raw).is_file():
                  raise SystemExit("approved deletion target is missing")
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"base_sha={head}\n")
              handle.write(f"dry_run={str(plan['dry_run']).lower()}\n")
              handle.write(f"change_count={len(plan['paths'])}\n")
          PY

      - name: Delete approved Posts and rebuild lineage then trends then graph
        if: ${{ steps.plan.outputs.dry_run == 'false' && steps.plan.outputs.change_count != '0' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("/tmp/approved-delete-plan/state/deletion-plan.json").read_text()
          )
          for raw in plan["paths"]:
              Path(raw).unlink()
          PY
          bash scripts/rebuild_release_data.sh

      - name: CAS persist deletion and all derived products
        id: persist
        if: ${{ steps.plan.outputs.dry_run == 'false' && steps.plan.outputs.change_count != '0' }}
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTOMATION_BRANCH="automation/delete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git switch -c "$AUTOMATION_BRANCH"
          python3 scripts/git_cas_writer.py commit-and-push \
            --repository . \
            --branch "$AUTOMATION_BRANCH" \
            --allowed-root blog \
            --allowed-root data \
            --allowed-path 'blog/content/posts/*.md' \
            --allowed-path 'blog/data/content_quality.json' \
            --allowed-path 'blog/static/data/lineage/*.json' \
            --allowed-path 'blog/static/data/stack-trends/*.json' \
            --allowed-path 'blog/static/data/tag-graph/*.json' \
            --allowed-path 'data/lineage/*.json' \
            --allow-deletions \
            --expected-base "$BASE_SHA" \
            --message 'chore(content): delete approved Posts and rebuild data [skip ci]' \
            >/tmp/delete-persist-receipt.json
          test "$(jq -r '.changed' /tmp/delete-persist-receipt.json)" = "true"
          head_sha="$(jq -r '.commit_sha' /tmp/delete-persist-receipt.json)"
          test "$(git rev-parse HEAD)" = "$head_sha"
          python3 scripts/protected_branch_merge.py merge \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$AUTOMATION_BRANCH" \
            --base-sha "$BASE_SHA" \
            --head-sha "$head_sha" \
            --title 'chore(content): delete approved Posts and rebuild data' \
            --body "Approved deletion from workflow run ${GITHUB_RUN_ID}." \
            >/tmp/delete-protected-merge-receipt.json
          persisted_sha="$(jq -r '.merge_sha' /tmp/delete-protected-merge-receipt.json)"
          git push \
            --force-with-lease="refs/heads/${AUTOMATION_BRANCH}:${head_sha}" \
            origin ":refs/heads/${AUTOMATION_BRANCH}" || \
            echo "::warning::deletion automation branch cleanup failed"
          echo "persisted_sha=$persisted_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy committed deletion and wait
        if: ${{ steps.persist.outputs.persisted_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PERSISTED_SHA: ${{ steps.persist.outputs.persisted_sha }}
        run: |
          set -euo pipefail
          python3 scripts/protected_branch_merge.py deploy \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$PERSISTED_SHA" \
            >/tmp/delete-deploy-receipt.json
          test "$(jq -r '.head_sha' /tmp/delete-deploy-receipt.json)" = "$PERSISTED_SHA"
