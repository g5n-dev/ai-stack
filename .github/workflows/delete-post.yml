name: Break-glass Content Deletion

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Exact relative path on content branch"
        required: true
        type: string
      reason:
        description: "Only secret leakage, PII, or legal deletion is permitted"
        required: true
        type: choice
        options:
          - secret_leakage
          - pii
          - legal_request
      expected_source_sha:
        description: "Expected content branch HEAD"
        required: true
        type: string
      backup_id:
        description: "Verified backup identifier"
        required: true
        type: string
      max_changes:
        description: "Hard deletion limit (1-100)"
        required: true
        default: "1"
        type: string
      dry_run:
        description: "Preview only; execution also requires Environment approval"
        required: true
        default: true
        type: boolean

concurrency:
  group: break-glass-content-delete
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete:
    name: approved-delete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: data-deletion
    permissions:
      contents: write
    steps:
      - name: Checkout trusted deletion code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: code
          persist-credentials: false

      - name: Checkout exact content ledger
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: content
          path: ledger
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout immutable backup records
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ops
          path: ops-ledger
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: code/uv.lock

      - name: Validate and apply bounded deletion
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          REASON: ${{ inputs.reason }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          BACKUP_ID: ${{ inputs.backup_id }}
          MAX_CHANGES: ${{ inputs.max_changes }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: code
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          args=(
            --repository ../ledger
            --target-path "$TARGET_PATH"
            --reason "$REASON"
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
            --backup-id "$BACKUP_ID"
            --backup-record "../ops-ledger/backups/${BACKUP_ID}.json"
            --max-changes "$MAX_CHANGES"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--execute)
          fi
          uv run python scripts/break_glass_delete.py "${args[@]}"
