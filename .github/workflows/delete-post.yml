name: Delete Post

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single: delete one post by path; scan: LLM-moderate and delete"
        required: false
        default: "scan"
        type: choice
        options:
          - single
          - scan
      post_path:
        description: "Relative path under blog/content/posts (e.g. blog/content/posts/20260101-xxx.md)"
        required: false
        type: string
      scan_limit:
        description: "How many latest posts to scan (mode=scan)"
        required: false
        default: "80"
        type: string
      dry_run:
        description: "Only validate and show planned changes"
        required: false
        default: true
        type: boolean

concurrency:
  group: delete-post-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  delete-post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs and prepare deletion
        id: prepare
        env:
          MODE: ${{ inputs.mode }}
          POST_PATH: ${{ inputs.post_path }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          set -euo pipefail

          MODE="${MODE:-scan}"
          if [ "${MODE}" != "single" ] && [ "${MODE}" != "scan" ]; then
            echo "mode must be one of: single, scan"
            exit 1
          fi

          if [ "${MODE}" = "single" ]; then
            if [ -z "${POST_PATH}" ]; then
              echo "post_path is required when mode=single"
              exit 1
            fi

            case "${POST_PATH}" in
              /*)
                echo "post_path must be a relative path"
                exit 1
                ;;
            esac

            case "${POST_PATH}" in
              *..*)
                echo "post_path must not contain '..'"
                exit 1
                ;;
            esac

            case "${POST_PATH}" in
              blog/content/posts/*.md)
                ;;
              *)
                echo "post_path must match: blog/content/posts/*.md"
                exit 1
                ;;
            esac

            if [ ! -f "${POST_PATH}" ]; then
              echo "File not found: ${POST_PATH}"
              exit 1
            fi

            echo "Planned deletion: ${POST_PATH}"
          fi

          if [ "${MODE}" = "scan" ]; then
            python - <<'PY'
            import json
            import os
            import re
            import subprocess
            from pathlib import Path

            import yaml

            from processor.anthropic_client import AnthropicClient
            from processor.ai_filter import AIThemeFilter

            scan_limit = int((os.environ.get("SCAN_LIMIT") or "80").strip() or 80)

            cmd = f"git ls-files 'blog/content/posts/*.md' | sort -r | head -n {scan_limit}"
            paths = subprocess.check_output(["bash", "-lc", cmd], text=True).splitlines()

            def extract_frontmatter_and_body(path: Path) -> tuple[dict, str]:
                text = path.read_text(encoding="utf-8", errors="ignore")
                if not text.startswith("---"):
                    return {}, text
                parts = text.split("\n---\n", 1)
                if len(parts) != 2:
                    return {}, text
                fm_raw = parts[0].lstrip("-").strip("\n")
                body = parts[1]
                try:
                    fm = yaml.safe_load(fm_raw) or {}
                    if not isinstance(fm, dict):
                        fm = {}
                except Exception:
                    fm = {}
                return fm, body

            def looks_like_meta_disclaimer(t: str) -> bool:
                s = (t or "").strip()
                if not s:
                    return False
                banned = ["由于您提供", "仅为标题", "我将基于", "鉴于您提供", "无法从提供", "我无法从"]
                return any(b in s for b in banned)

            config_path = "config/anthropic.yaml"
            client = AnthropicClient(config_path)
            cfg = yaml.safe_load(Path(config_path).read_text(encoding="utf-8")) or {}
            ai_filter_cfg = ((cfg.get("anthropic") or {}).get("ai_filter") or {})
            flt = AIThemeFilter(client, ai_filter_cfg)

            to_delete: list[str] = []
            report: list[dict] = []

            for p in paths:
                path = Path(p)
                if not path.exists():
                    continue
                fm, body = extract_frontmatter_and_body(path)
                title = str(fm.get("title") or "").strip()
                description = str(fm.get("description") or "").strip()
                tags = fm.get("tags", [])
                categories = fm.get("categories", [])
                source = str(fm.get("source") or "").strip()
                external_url = str(fm.get("external_url") or fm.get("url") or "").strip()

                body_snippet = re.sub(r"\s+", " ", body.strip())[:900]
                if looks_like_meta_disclaimer(body_snippet):
                    to_delete.append(p)
                    report.append({"path": p, "title": title, "decision": "delete", "reason": "low_quality_meta_disclaimer"})
                    continue

                content = {
                    "source": source,
                    "title": title,
                    "catchy_title": title,
                    "description": description,
                    "summary": body_snippet,
                    "tags": tags if isinstance(tags, list) else [],
                    "categories": categories if isinstance(categories, list) else [],
                    "url": external_url,
                }

                content = flt.filter(content)
                content = flt.moderate(content)

                should_publish = bool(content.get("should_publish", True))
                ai_related = bool(content.get("ai_related", True))
                if (not should_publish) or (not ai_related):
                    to_delete.append(p)
                    report.append(
                        {
                            "path": p,
                            "title": title,
                            "decision": "delete",
                            "ai_related": ai_related,
                            "should_publish": should_publish,
                            "moderation_reason": content.get("moderation_reason", ""),
                            "moderation_confidence": content.get("moderation_confidence", 0.0),
                            "moderation_flags": content.get("moderation_flags", {}),
                            "ai_reason": content.get("ai_reason", ""),
                            "ai_confidence": content.get("ai_confidence", 0.0),
                        }
                    )
                else:
                    report.append(
                        {
                            "path": p,
                            "title": title,
                            "decision": "keep",
                            "moderation_confidence": content.get("moderation_confidence", 0.0),
                        }
                    )

            Path("moderation-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
            Path("to-delete.txt").write_text("\n".join(to_delete) + ("\n" if to_delete else ""), encoding="utf-8")
            print(f"scanned={len(paths)} delete={len(to_delete)} report=moderation-report.json")
            PY

            if [ ! -f to-delete.txt ] || [ ! -s to-delete.txt ]; then
              echo "No files to delete"
              exit 0
            fi

            echo "Planned deletions:"
            cat to-delete.txt

          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: skipping delete, derived-data rebuild, commit and deploy"
            exit 0
          fi

          # Rebase before mutating tracked content. Any concurrent conflict stops
          # the workflow instead of discarding either side.
          git pull --rebase origin main

          if [ "${MODE}" = "single" ]; then
            if [ ! -f "${POST_PATH}" ]; then
              echo "File disappeared after synchronizing main: ${POST_PATH}"
              exit 1
            fi
            git rm -f "${POST_PATH}"
          else
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              if [ ! -f "${path}" ]; then
                echo "Scanned file disappeared after synchronizing main: ${path}"
                exit 1
              fi
              git rm -f -- "${path}"
            done < to-delete.txt
          fi

          git status --porcelain
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Rebuild Post-derived data
        if: ${{ steps.prepare.outputs.changed == 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          TAG_GRAPH_ENABLE_CONTENT_MINING: "0"
          TAG_INTRO_ENABLED: "0"
          TAG_INTRO_MAX_NEW: "0"
        run: |
          set -euo pipefail
          python3 scripts/build_content_quality_manifest.py \
            --content-root blog/content \
            --output blog/data/content_quality.json \
            --fail-on-quarantine \
            --fail-on-structural-warning
          python3 -m processor.tag_graph
          python3 scripts/verify_graph.py --assets-only --public-dir blog/static
          python3 scripts/build_stack_trends.py \
            --content-root blog/content \
            --quality-manifest blog/data/content_quality.json \
            --output blog/static/data/stack-trends
          python3 scripts/verify_stack_trends.py \
            --root blog/static/data/stack-trends \
            --verify-hashes

      - name: Commit deletion and generated data
        id: commit
        if: ${{ steps.prepare.outputs.changed == 'true' }}
        env:
          MODE: ${{ inputs.mode }}
          POST_PATH: ${{ inputs.post_path }}
        run: |
          set -euo pipefail
          git add -A -- \
            blog/content/posts \
            blog/data/content_quality.json \
            blog/static/data/tag-graph \
            blog/static/data/stack-trends

          if git diff --cached --quiet; then
            echo "Deletion was prepared but no tracked Post-derived change remains"
            exit 1
          fi

          if [ "${MODE:-scan}" = "single" ]; then
            commit_subject="Delete post: $(basename "${POST_PATH}")"
          else
            commit_subject="Moderation delete posts"
          fi
          git commit -m "${commit_subject}"
          git push origin HEAD:main
          echo "head_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Deploy committed deletion and wait
        if: ${{ steps.commit.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          case "${HEAD_SHA}" in
            ''|*[!0-9a-f]*)
              echo "Invalid committed SHA: ${HEAD_SHA}"
              exit 1
              ;;
          esac

          gh workflow run deploy.yml --ref main -f refresh_data=false

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(
              gh run list \
                --workflow deploy.yml \
                --event workflow_dispatch \
                --commit "${HEAD_SHA}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${run_id}" ]; then
            echo "Timed out waiting for deploy run for ${HEAD_SHA}"
            exit 1
          fi

          echo "Watching deploy run ${run_id} for ${HEAD_SHA}"
          gh run watch "${run_id}" --exit-status --interval 10
