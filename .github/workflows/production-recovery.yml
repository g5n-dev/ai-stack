name: Production Recovery

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Previously production-verified full SHA to rebuild"
        required: true
        type: string
      reason:
        description: "Operational recovery reason"
        required: true
        type: string

concurrency:
  group: production-recovery
  cancel-in-progress: false

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-recovery
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
    steps:
      - name: Checkout main history without mutation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0

      - name: Authorize only a verified main ancestor
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase SHA" >&2
            exit 1
          }
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          artifact="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="verified-release-${TARGET_SHA}" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')"
          artifact_id="$(python3 -c 'import json,sys; value=json.load(sys.stdin); print(value.get("id", ""))' <<<"$artifact")"
          run_id="$(python3 -c 'import json,sys; value=json.load(sys.stdin); print((value.get("workflow_run") or {}).get("id", ""))' <<<"$artifact")"
          [[ -n "$artifact_id" && -n "$run_id" ]] || {
            echo "target SHA has no retained production verification proof" >&2
            exit 1
          }
          workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.path')"
          [[ "$workflow_path" == ".github/workflows/deploy.yml" ]] || {
            echo "verification proof has invalid workflow provenance" >&2
            exit 1
          }
          verify_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '[.jobs[] | select(.name == "production-verify")][0].conclusion // ""')"
          [[ "$verify_conclusion" == "success" ]] || {
            echo "target SHA was not production-verified successfully" >&2
            exit 1
          }
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.marker.outputs.release_id }}
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0

      - name: Assert exact authorized build input
        run: test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.target_sha }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@dc99976453b04b1029527154fc04fef80a4a49cf
        with:
          hugo-version: "0.153.4"
          extended: true

      - name: Install deterministic build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Rebuild only the authorized persisted SHA
        run: |
          set -euo pipefail
          python3 scripts/build_content_quality_manifest.py \
            --content-root blog/content \
            --output /tmp/content_quality.json \
            --fail-on-quarantine \
            --fail-on-structural-warning \
            --fail-on-unverified-provenance
          cmp --silent blog/data/content_quality.json /tmp/content_quality.json
          python3 scripts/verify_stack_trends.py \
            --root blog/static/data/stack-trends --verify-hashes
          python3 scripts/verify_graph.py --assets-only --public-dir blog/static
          if [[ -f config/lineage.yaml ]]; then
            python3 scripts/verify_lineage.py --verify-hashes
          fi
          npm run build:css
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- \
            data/lineage \
            blog/content/posts \
            blog/data/content_quality.json \
            blog/static/css/tailwind.css \
            blog/static/data/lineage \
            blog/static/data/stack-trends \
            blog/static/data/tag-graph)"
          cd blog
          hugo --baseURL "https://ai-stack.site/" --minify --cleanDestinationDir
          cd ..
          ./node_modules/.bin/pagefind --site blog/public
          python3 -m ai_stack.pagefind_catalog --public-root blog/public
          mkdir -p blog/public/data
          cp blog/data/content_quality.json blog/public/data/content-quality.json

      - name: Restore dedicated public IndexNow ownership key
        env:
          BING_INDEXNOW_OWNERSHIP_KEY: ${{ vars.BING_INDEXNOW_OWNERSHIP_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$BING_INDEXNOW_OWNERSHIP_KEY" ]]; then
            [[ "$BING_INDEXNOW_OWNERSHIP_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]] || exit 1
            printf '%s' "$BING_INDEXNOW_OWNERSHIP_KEY" \
              >"blog/public/${BING_INDEXNOW_OWNERSHIP_KEY}.txt"
          fi

      - name: Recreate and guard exact release marker
        id: marker
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
        run: |
          set -euo pipefail
          lineage_args=()
          [[ ! -f config/lineage.yaml ]] || lineage_args+=(--require-lineage)
          python3 scripts/release_marker.py create \
            --public-root blog/public \
            --exact-sha "$TARGET_SHA" \
            --output blog/public/ai_stack_release_v1.json \
            "${lineage_args[@]}"
          python3 scripts/release_guard.py guard-marker \
            --public-root blog/public \
            --marker blog/public/ai_stack_release_v1.json \
            --expected-sha "$TARGET_SHA" \
            --tree-manifest-output /tmp/recovery-public-tree-manifest.json \
            "${lineage_args[@]}"
          release_id="$(python3 -c 'import json; print(json.load(open("blog/public/ai_stack_release_v1.json"))["release_id"])')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload authorized recovery Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: blog/public

  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy authorized recovery artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  production-verify:
    needs: [authorize, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verifier at authorized SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}

      - name: Verify recovered production release
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: |
          python3 scripts/production_smoke.py \
            --base-url "https://ai-stack.site/" \
            --expected-sha "$TARGET_SHA" \
            --expected-release-id "$RELEASE_ID"
