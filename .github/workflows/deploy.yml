name: Build and Deploy

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-and-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AI_STACK_RUNTIME_PROFILE: ci
  SITE_BASE_URL: https://ai-stack.site/
  PYTHONUTF8: "1"

jobs:
  crawl:
    name: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      code_sha: ${{ steps.identity.outputs.code_sha }}
    steps:
      - name: Checkout exact code revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bind immutable run identity
        id: identity
        run: |
          set -euo pipefail
          echo "run_id=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Crawl without model credentials
        env:
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ai-stack crawl --run-id "$RUN_ID" --output handoff
          uv run python scripts/artifact_guard.py pack \
            --profile discovery --root handoff \
            --archive transfer/discovery.tar \
            --manifest transfer/discovery.manifest.json
      - name: Upload discovery handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discovery-${{ steps.identity.outputs.run_id }}
          path: transfer
          if-no-files-found: error
          retention-days: 7

  validate_discovery:
    name: validate-discovery
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout validator code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download untrusted discovery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: discovery-${{ needs.crawl.outputs.run_id }}
          path: transfer
      - name: Revalidate discovery and package validated handoff
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile discovery --archive transfer/discovery.tar \
            --manifest transfer/discovery.manifest.json --extract-to handoff
          uv run ai-stack validate --kind discovery --input handoff --output validated
          uv run python scripts/artifact_guard.py pack \
            --profile discovery --root validated \
            --archive validated-transfer/discovery.tar \
            --manifest validated-transfer/discovery.manifest.json
      - name: Upload validated discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-discovery-${{ needs.crawl.outputs.run_id }}
          path: validated-transfer
          if-no-files-found: error
          retention-days: 7

  persist_discovery:
    name: persist-discovery
    needs: [crawl, validate_discovery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      content_sha: ${{ steps.persist.outputs.commit_sha }}
    steps:
      - name: Checkout trusted writer code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          path: code
          persist-credentials: false
      - name: Checkout content ledger
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: content
          path: ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: code/uv.lock
      - name: Download validated discovery
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-discovery-${{ needs.crawl.outputs.run_id }}
          path: code/validated-transfer
      - name: CAS-persist discovery
        id: persist
        working-directory: code
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile discovery --archive validated-transfer/discovery.tar \
            --manifest validated-transfer/discovery.manifest.json --extract-to validated
          base_content_sha=$(git -C ../ledger rev-parse HEAD)
          test "$(git -C ../ledger symbolic-ref --quiet --short HEAD)" = "content"
          uv run ai-stack process --phase persist-discovery \
            --run-id "$RUN_ID" --input validated --state-root ../ledger
          result=$(uv run python scripts/git_cas_writer.py commit-and-push \
            --repository ../ledger --branch content \
            --allowed-root content --allowed-root state \
            --expected-base "$base_content_sha" \
            --message "Persist discovery ${RUN_ID}")
          echo "commit_sha=$(python -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"

  reserve_budget:
    name: reserve-budget
    needs: [crawl, persist_discovery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ops_sha: ${{ steps.reserve.outputs.commit_sha }}
    steps:
      - name: Checkout trusted budget code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          path: code
          persist-credentials: false
      - name: Checkout exact content state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.persist_discovery.outputs.content_sha }}
          path: content-ledger
          persist-credentials: false
      - name: Checkout ops ledger
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ops
          path: ops-ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: code/uv.lock
      - name: Reserve worst-case budget before model job
        id: reserve
        working-directory: code
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          base_ops_sha=$(git -C ../ops-ledger rev-parse HEAD)
          test "$(git -C ../ops-ledger symbolic-ref --quiet --short HEAD)" = "ops"
          uv run ai-stack process --phase reserve-budget \
            --run-id "$RUN_ID" --input ../content-ledger --state-root ../ops-ledger
          result=$(uv run python scripts/git_cas_writer.py commit-and-push \
            --repository ../ops-ledger --branch ops \
            --allowed-root ops --allowed-root state \
            --expected-base "$base_ops_sha" \
            --message "Reserve budget ${RUN_ID}")
          echo "commit_sha=$(python -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"

  generate:
    name: generate
    needs: [crawl, persist_discovery, reserve_budget]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact generator code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Checkout exact content state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.persist_discovery.outputs.content_sha }}
          path: content-ledger
          persist-credentials: false
      - name: Checkout exact budget reservation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.reserve_budget.outputs.ops_sha }}
          path: ops-ledger
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Generate structured candidates without Git credentials
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ai-stack process --phase generate --run-id "$RUN_ID" \
            --input content-ledger --ops-root ops-ledger --output handoff
          uv run python scripts/artifact_guard.py pack \
            --profile generated --root handoff \
            --archive transfer/generated.tar \
            --manifest transfer/generated.manifest.json
      - name: Upload generated candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-${{ needs.crawl.outputs.run_id }}
          path: transfer
          if-no-files-found: error
          retention-days: 7

  validate_result:
    name: validate-result
    needs: [crawl, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout validator code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download untrusted generated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-${{ needs.crawl.outputs.run_id }}
          path: transfer
      - name: Deterministically validate evidence and content safety
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile generated --archive transfer/generated.tar \
            --manifest transfer/generated.manifest.json --extract-to generated
          uv run ai-stack validate --kind generated --input generated --output validated
          uv run python scripts/artifact_guard.py pack \
            --profile validated --root validated \
            --archive validated-transfer/validated.tar \
            --manifest validated-transfer/validated.manifest.json
      - name: Upload validated results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-result-${{ needs.crawl.outputs.run_id }}
          path: validated-transfer
          if-no-files-found: error
          retention-days: 7

  persist_result:
    name: persist-result
    needs: [crawl, persist_discovery, validate_result]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      content_sha: ${{ steps.persist.outputs.commit_sha }}
    steps:
      - name: Checkout trusted writer code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          path: code
          persist-credentials: false
      - name: Checkout exact content parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: content
          path: ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: code/uv.lock
      - name: Download validated result artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-result-${{ needs.crawl.outputs.run_id }}
          path: code/validated-transfer
      - name: CAS-persist validated results
        id: persist
        working-directory: code
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile validated --archive validated-transfer/validated.tar \
            --manifest validated-transfer/validated.manifest.json --extract-to validated
          base_content_sha=$(git -C ../ledger rev-parse HEAD)
          test "$(git -C ../ledger symbolic-ref --quiet --short HEAD)" = "content"
          test "$base_content_sha" = "${{ needs.persist_discovery.outputs.content_sha }}"
          uv run ai-stack process --phase persist-result \
            --run-id "$RUN_ID" --input validated --state-root ../ledger
          result=$(uv run python scripts/git_cas_writer.py commit-and-push \
            --repository ../ledger --branch content \
            --allowed-root content --allowed-root state \
            --expected-base "$base_content_sha" \
            --message "Persist validated result ${RUN_ID}")
          echo "commit_sha=$(python -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"

  build:
    name: build-exact-release
    needs: [crawl, reserve_budget, persist_result]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      artifact_digest: ${{ steps.release.outputs.artifact_digest }}
    steps:
      - name: Checkout exact code SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Checkout exact content SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.persist_result.outputs.content_sha }}
          path: content-ledger
          persist-credentials: false
      - name: Checkout exact ops SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.reserve_budget.outputs.ops_sha }}
          path: ops-ledger
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: npm
      - name: Install locked Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.153.4"
          extended: true
      - name: Revalidate exact ledger inputs
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          npm ci
          uv run ai-stack validate --state-root content-ledger/state
          uv run ai-stack validate --state-root ops-ledger/state
      - name: Render one content-addressed release
        id: release
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
          CODE_SHA: ${{ needs.crawl.outputs.code_sha }}
          CONTENT_SHA: ${{ needs.persist_result.outputs.content_sha }}
          OPS_SHA: ${{ needs.reserve_budget.outputs.ops_sha }}
        run: |
          set -euo pipefail
          npm run build:css
          uv run ai-stack render --run-id "$RUN_ID" \
            --code-sha "$CODE_SHA" --content-sha "$CONTENT_SHA" --ops-sha "$OPS_SHA" \
            --content-root content-ledger --ops-root ops-ledger --output build-handoff
          uv run python scripts/build_related_index.py \
            --content-dir content-ledger/content/posts \
            --output blog/data/related/index.json
          hugo --source blog --config config.toml,ledger-mount.toml \
            --baseURL "$SITE_BASE_URL" --minify --cleanDestinationDir
          npm run build:search
          uv run python scripts/validate_public_content.py --rendered-root blog/public
          uv run python scripts/release_guard.py create \
            --public-root blog/public \
            --basis build-handoff/state/release-basis.json \
            --output build-handoff/state/release.json
          test -f build-handoff/state/public-tree-manifest.json
          uv run python scripts/artifact_guard.py pack \
            --profile release --root build-handoff \
            --archive release-transfer/release.tar \
            --manifest release-transfer/release.manifest.json
          artifact_digest=$(python -c 'import json; print(json.load(open("build-handoff/state/release.json"))["artifact_digest"])')
          release_id=$(python -c 'import json; print(json.load(open("build-handoff/state/release.json"))["release_id"])')
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Upload exact release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.crawl.outputs.run_id }}
          path: release-transfer
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: blog/public

  deploy:
    name: deploy-exact-release
    needs: [crawl, persist_result, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout release guard
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Download exact release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.crawl.outputs.run_id }}
          path: release-transfer
      - name: Reject stale or forged release
        run: |
          set -euo pipefail
          python3 scripts/artifact_guard.py validate \
            --profile release --archive release-transfer/release.tar \
            --manifest release-transfer/release.manifest.json --extract-to release
          args=(--candidate release/state/release.json \
            --expected-code-sha "${{ needs.crawl.outputs.code_sha }}" \
            --expected-content-sha "${{ needs.persist_result.outputs.content_sha }}" \
            --expected-artifact-digest "${{ needs.build.outputs.artifact_digest }}")
          if [ -f release/state/current-release.json ]; then
            args+=(--current release/state/current-release.json)
          fi
          python3 scripts/release_guard.py validate "${args[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  health:
    name: production-health
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify deployed release identity
        env:
          EXPECTED_RELEASE: ${{ needs.build.outputs.release_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --output manifest.json \
              "${SITE_BASE_URL}api/v1/manifest.json"; then
              actual=$(python3 -c 'import json; print(json.load(open("manifest.json"))["active_release"])')
              if [ "$actual" = "$EXPECTED_RELEASE" ]; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "production did not converge to expected release" >&2
          exit 1

  publish:
    name: publish-outbox
    needs: [crawl, build, health]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-publish
    permissions:
      contents: read
    steps:
      - name: Checkout publisher code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          persist-credentials: false
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download exact release outbox
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.crawl.outputs.run_id }}
          path: release-transfer
      - name: Consume enabled channels only after health
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile release --archive release-transfer/release.tar \
            --manifest release-transfer/release.manifest.json --extract-to release
          uv run ai-stack publish --run-id "$RUN_ID" \
            --input release/content/outbox --output receipt-handoff
          uv run python scripts/artifact_guard.py pack \
            --profile receipt --root receipt-handoff \
            --archive receipt-transfer/receipt.tar \
            --manifest receipt-transfer/receipt.manifest.json
      - name: Upload untrusted channel receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-${{ needs.crawl.outputs.run_id }}
          path: receipt-transfer
          if-no-files-found: error
          retention-days: 30

  persist_receipt:
    name: persist-receipt
    needs: [crawl, reserve_budget, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted receipt writer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.crawl.outputs.code_sha }}
          path: code
          persist-credentials: false
      - name: Checkout exact ops parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ops
          path: ops-ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: code/uv.lock
      - name: Download channel receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: receipt-${{ needs.crawl.outputs.run_id }}
          path: code/receipt-transfer
      - name: Revalidate and CAS-persist receipt
        working-directory: code
        env:
          RUN_ID: ${{ needs.crawl.outputs.run_id }}
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python scripts/artifact_guard.py validate \
            --profile receipt --archive receipt-transfer/receipt.tar \
            --manifest receipt-transfer/receipt.manifest.json --extract-to receipt
          base_ops_sha=$(git -C ../ops-ledger rev-parse HEAD)
          test "$(git -C ../ops-ledger symbolic-ref --quiet --short HEAD)" = "ops"
          test "$base_ops_sha" = "${{ needs.reserve_budget.outputs.ops_sha }}"
          uv run ai-stack process --phase persist-receipt \
            --run-id "$RUN_ID" --input receipt --state-root ../ops-ledger
          uv run python scripts/git_cas_writer.py commit-and-push \
            --repository ../ops-ledger --branch ops \
            --allowed-root ops --allowed-root state \
            --expected-base "$base_ops_sha" \
            --message "Persist receipt ${RUN_ID}"
