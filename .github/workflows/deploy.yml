name: Build and Deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          if pip show playwright > /dev/null 2>&1; then
            playwright install chromium
            playwright install-deps chromium
          else
            echo "Playwright not found, skipping browser installation"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Run crawler
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          echo "=== Generating Posts (crawl + process + write markdown) ==="
          if [ -f scripts/generate_content.py ]; then
            python3 scripts/generate_content.py --dedupe-scope global
          else
            echo "Content generator not found, skipping..."
          fi

      - name: Build tag graph
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          echo "=== Building Tag Graph ==="
          if [ -f processor/tag_graph.py ]; then
            python3 -m processor.tag_graph
          else
            echo "Tag graph generator not found, skipping..."
          fi

      - name: Build Hugo site
        run: |
          echo "=== Building Hugo Site ==="
          if [ -f blog/config.toml ]; then
            cd blog
            hugo --baseURL "https://ai-stack.site/" --minify --cleanDestinationDir
          else
            echo "Hugo config not found, skipping build"
            exit 1
          fi

      - name: Commit changes
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Update content and build $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
          git push origin main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
