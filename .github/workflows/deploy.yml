name: Build and Deploy

on:
  schedule:
    # 避开整点拥塞；保留已锁定的 :17 触发。
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Crawl and regenerate Post-derived data before deploy"
        required: false
        default: true
        type: boolean
      expected_sha:
        description: "Optional exact main SHA required for chained deploys"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main

concurrency:
  group: build-and-deploy-main
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
    env:
      AI_STACK_RUNTIME_PROFILE: ci
      AI_STACK_REFRESH_DATA: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data) }}
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Partial clone: full commit history is still required (build_lineage
          # and publish_heartbeat derive first-seen times from git log), but the
          # historical blobs are not. Fetching them made checkout exceed the job
          # timeout on a 4.1 GB repository and silently stranded generated posts.
          filter: blob:none

      - name: Record exact base SHA
        id: base
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SHA" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$base_sha" = "$EXPECTED_SHA" || {
              echo "main SHA does not match chained deploy receipt" >&2
              exit 1
            }
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install refresh dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install crawler browser
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        run: |
          if python3 -m pip show playwright >/dev/null 2>&1; then
            python3 -m playwright install --with-deps chromium
          fi

      - name: Refresh Posts with crawler and model
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/generate_content.py \
            --dedupe-scope global \
            --runtime-profile "$AI_STACK_RUNTIME_PROFILE"

      - name: Sanitize public source URLs
        run: python3 scripts/generate_content.py --sanitize-relrefs-only

      - name: Package exact refresh handoff
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: |
          set -euo pipefail
          root=/tmp/refresh-handoff
          mkdir -p "$root/blog/content/posts"
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.md' --exclude='*' \
            blog/content/posts/ "$root/blog/content/posts/"
          if [[ -d data/lineage ]]; then
            mkdir -p "$root/data/lineage"
            rsync -a --prune-empty-dirs \
              --include='*/' --include='*.json' --exclude='*' \
              data/lineage/ "$root/data/lineage/"
          fi
          python3 scripts/artifact_guard.py pack \
            --profile refresh \
            --root "$root" \
            --archive /tmp/refresh.tar \
            --manifest /tmp/refresh.manifest.json \
            --reject-env ANTHROPIC_AUTH_TOKEN \
            --reject-env ANTHROPIC_BASE_URL \
            --reject-env SEARXNG_BASE_URL

      - name: Upload refresh handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-${{ github.run_id }}
          path: |
            /tmp/refresh.tar
            /tmp/refresh.manifest.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  validate:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.refresh.outputs.base_sha }}
          fetch-depth: 0
          # Partial clone: full commit history is still required (build_lineage
          # and publish_heartbeat derive first-seen times from git log), but the
          # historical blobs are not. Fetching them made checkout exceed the job
          # timeout on a 4.1 GB repository and silently stranded generated posts.
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download untrusted refresh handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: refresh-${{ github.run_id }}
          path: /tmp/download-refresh

      - name: Validate hashes and apply refresh handoff
        run: |
          set -euo pipefail
          python3 scripts/artifact_guard.py validate \
            --profile refresh \
            --archive /tmp/download-refresh/refresh.tar \
            --manifest /tmp/download-refresh/refresh.manifest.json \
            --extract-to /tmp/validated-refresh
          python3 scripts/refresh_transition_guard.py \
            --baseline blog/content/posts \
            --candidate /tmp/validated-refresh/blog/content/posts \
            --max-added 500 \
            --max-added-percent 35
          mkdir -p blog/content/posts
          find blog/content/posts -type f -name '*.md' -delete
          cp -R /tmp/validated-refresh/blog/content/posts/. blog/content/posts/
          if [[ -d /tmp/validated-refresh/data/lineage ]]; then
            rm -rf data/lineage
            mkdir -p data/lineage
            cp -R /tmp/validated-refresh/data/lineage/. data/lineage/
          fi

      - name: Rebuild and validate derived release data without secrets
        run: bash scripts/rebuild_release_data.sh

      - name: Package exact validated handoff
        run: |
          set -euo pipefail
          root=/tmp/validated-handoff
          mkdir -p \
            "$root/blog/content/posts" \
            "$root/blog/data" \
            "$root/blog/static/data/stack-trends" \
            "$root/blog/static/data/tag-graph"
          rsync -a --prune-empty-dirs --include='*/' --include='*.md' --exclude='*' \
            blog/content/posts/ "$root/blog/content/posts/"
          cp blog/data/content_quality.json "$root/blog/data/content_quality.json"
          rsync -a --prune-empty-dirs --include='*/' --include='*.json' --exclude='*' \
            blog/static/data/stack-trends/ "$root/blog/static/data/stack-trends/"
          rsync -a --prune-empty-dirs --include='*/' --include='*.json' --exclude='*' \
            blog/static/data/tag-graph/ "$root/blog/static/data/tag-graph/"
          if [[ -d data/lineage ]]; then
            mkdir -p "$root/data/lineage"
            rsync -a --prune-empty-dirs --include='*/' --include='*.json' --exclude='*' \
              data/lineage/ "$root/data/lineage/"
          fi
          if [[ -d blog/static/data/lineage ]]; then
            mkdir -p "$root/blog/static/data/lineage"
            rsync -a --prune-empty-dirs --include='*/' --include='*.json' --exclude='*' \
              blog/static/data/lineage/ "$root/blog/static/data/lineage/"
          fi
          python3 scripts/artifact_guard.py pack \
            --profile validated \
            --root "$root" \
            --archive /tmp/validated.tar \
            --manifest /tmp/validated.manifest.json

      - name: Upload validated handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-${{ github.run_id }}
          path: |
            /tmp/validated.tar
            /tmp/validated.manifest.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  persist:
    needs: [refresh, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    outputs:
      persisted_sha: ${{ steps.persist.outputs.persisted_sha }}
    steps:
      - name: Checkout main for exact CAS write
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          # Partial clone: full commit history is still required (build_lineage
          # and publish_heartbeat derive first-seen times from git log), but the
          # historical blobs are not. Fetching them made checkout exceed the job
          # timeout on a 4.1 GB repository and silently stranded generated posts.
          filter: blob:none

      - name: Download validated handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-${{ github.run_id }}
          path: /tmp/download-validated

      - name: Validate exact handoff and replace allowlisted data
        env:
          BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 scripts/artifact_guard.py validate \
            --profile validated \
            --archive /tmp/download-validated/validated.tar \
            --manifest /tmp/download-validated/validated.manifest.json \
            --extract-to /tmp/persist-input
          find blog/content/posts -type f -name '*.md' -delete
          cp -R /tmp/persist-input/blog/content/posts/. blog/content/posts/
          for path in \
            blog/static/data/stack-trends \
            blog/static/data/tag-graph; do
            rm -rf "$path"
            mkdir -p "$path"
            cp -R "/tmp/persist-input/$path/." "$path/"
          done
          mkdir -p blog/data
          cp /tmp/persist-input/blog/data/content_quality.json blog/data/content_quality.json
          for path in data/lineage blog/static/data/lineage; do
            if [[ -d "/tmp/persist-input/$path" ]]; then
              rm -rf "$path"
              mkdir -p "$path"
              cp -R "/tmp/persist-input/$path/." "$path/"
            fi
          done

      - name: Persist validated files with exact-base CAS
        id: persist
        env:
          BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTOMATION_BRANCH="automation/data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git switch -c "$AUTOMATION_BRANCH"
          python3 scripts/git_cas_writer.py commit-and-push \
            --repository . \
            --branch "$AUTOMATION_BRANCH" \
            --allowed-root blog \
            --allowed-root data \
            --allowed-path 'blog/content/posts/*.md' \
            --allowed-path 'blog/data/content_quality.json' \
            --allowed-path 'blog/static/data/lineage/*.json' \
            --allowed-path 'blog/static/data/stack-trends/*.json' \
            --allowed-path 'blog/static/data/tag-graph/*.json' \
            --allowed-path 'data/lineage/*.json' \
            --allow-deletions \
            --expected-base "${BASE_SHA}" \
            --message 'chore(data): persist validated release [skip ci]' \
            >/tmp/persist-receipt.json
          changed="$(jq -r '.changed' /tmp/persist-receipt.json)"
          if [[ "$changed" == "false" ]]; then
            persisted_sha="$BASE_SHA"
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$persisted_sha"
          elif [[ "$changed" == "true" ]]; then
            head_sha="$(jq -r '.commit_sha' /tmp/persist-receipt.json)"
            test "$(git rev-parse HEAD)" = "$head_sha"
            python3 scripts/protected_branch_merge.py merge \
              --repository "$GITHUB_REPOSITORY" \
              --branch "$AUTOMATION_BRANCH" \
              --base-sha "$BASE_SHA" \
              --head-sha "$head_sha" \
              --title 'chore(data): persist validated release' \
              --body "Validated data release from workflow run ${GITHUB_RUN_ID}." \
              >/tmp/protected-merge-receipt.json
            persisted_sha="$(jq -r '.merge_sha' /tmp/protected-merge-receipt.json)"
            git push \
              --force-with-lease="refs/heads/${AUTOMATION_BRANCH}:${head_sha}" \
              origin ":refs/heads/${AUTOMATION_BRANCH}" || \
              echo "::warning::validated automation branch cleanup failed"
          else
            echo "invalid CAS writer receipt" >&2
            exit 1
          fi
          echo "persisted_sha=$persisted_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: persist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      exact_sha: ${{ steps.marker.outputs.exact_sha }}
      release_id: ${{ steps.marker.outputs.release_id }}
    steps:
      - name: Checkout exact persisted SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.persist.outputs.persisted_sha }}
          fetch-depth: 0
          # Partial clone: full commit history is still required (build_lineage
          # and publish_heartbeat derive first-seen times from git log), but the
          # historical blobs are not. Fetching them made checkout exceed the job
          # timeout on a 4.1 GB repository and silently stranded generated posts.
          filter: blob:none

      - name: Assert exact build input
        run: test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.persisted_sha }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@dc99976453b04b1029527154fc04fef80a4a49cf
        with:
          hugo-version: "0.153.4"
          extended: true

      - name: Install build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Rebuild persisted products and prove fixed point
        run: |
          set -euo pipefail
          bash scripts/rebuild_release_data.sh
          npm run build:css
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- \
            data/lineage \
            blog/content/posts \
            blog/data/content_quality.json \
            blog/static/css/tailwind.css \
            blog/static/data/lineage \
            blog/static/data/stack-trends \
            blog/static/data/tag-graph)"

      - name: Build exact Hugo and Pagefind site
        run: |
          set -euo pipefail
          cd blog
          hugo --baseURL "https://ai-stack.site/" --minify --cleanDestinationDir
          cd ..
          ./node_modules/.bin/pagefind --site blog/public
          python3 -m ai_stack.pagefind_catalog --public-root blog/public
          test -s blog/public/pagefind/pagefind.js
          test -s blog/public/pagefind/catalog.json
          mkdir -p blog/public/data
          cp blog/data/content_quality.json blog/public/data/content-quality.json

      - name: Prepare dedicated public IndexNow ownership key
        env:
          BING_INDEXNOW_OWNERSHIP_KEY: ${{ vars.BING_INDEXNOW_OWNERSHIP_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$BING_INDEXNOW_OWNERSHIP_KEY" ]]; then
            [[ "$BING_INDEXNOW_OWNERSHIP_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]] || {
              echo "Invalid IndexNow public ownership key format" >&2
              exit 1
            }
            printf '%s' "$BING_INDEXNOW_OWNERSHIP_KEY" \
              >"blog/public/${BING_INDEXNOW_OWNERSHIP_KEY}.txt"
          fi

      - name: Create immutable release marker and guard Pages tree
        id: marker
        env:
          EXACT_SHA: ${{ needs.persist.outputs.persisted_sha }}
        run: |
          set -euo pipefail
          lineage_args=()
          [[ ! -f config/lineage.yaml ]] || lineage_args+=(--require-lineage)
          python3 scripts/release_marker.py create \
            --public-root blog/public \
            --exact-sha "$EXACT_SHA" \
            --output blog/public/ai_stack_release_v1.json \
            "${lineage_args[@]}"
          mkdir -p /tmp/release-evidence
          python3 scripts/release_guard.py guard-marker \
            --public-root blog/public \
            --marker blog/public/ai_stack_release_v1.json \
            --expected-sha "$EXACT_SHA" \
            --tree-manifest-output /tmp/release-evidence/public-tree-manifest.json \
            "${lineage_args[@]}"
          cp blog/public/ai_stack_release_v1.json /tmp/release-evidence/
          release_id="$(python3 -c 'import json; print(json.load(open("blog/public/ai_stack_release_v1.json"))["release_id"])')"
          echo "exact_sha=$EXACT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload guarded Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: blog/public

      - name: Upload release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-proof-${{ github.run_id }}
          path: /tmp/release-evidence
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact guarded artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  production-verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verifier at exact release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.build.outputs.exact_sha }}

      - name: Verify production after cache convergence
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.exact_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 scripts/production_smoke.py \
            --base-url "https://ai-stack.site/" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-release-id "$EXPECTED_RELEASE_ID" \
            >/tmp/production-smoke.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/production-smoke.json").read_text())
          evidence = {
              "schema_version": "verified_production_release_v1",
              "exact_sha": os.environ["EXPECTED_SHA"],
              "release_id": os.environ["EXPECTED_RELEASE_ID"],
              "status": report["status"],
          }
          Path("/tmp/verified-release.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Retain verified release proof for recovery authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ needs.build.outputs.exact_sha }}
          path: /tmp/verified-release.json
          retention-days: 90
          if-no-files-found: error

  notify:
    needs: [build, production-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-publish
    permissions:
      contents: read
    steps:
      - name: Checkout notifier at verified release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.build.outputs.exact_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install notifier dependency
        run: python3 -m pip install --disable-pip-version-check requests==2.32.5

      - name: Notify search indexes only after production verification
        env:
          SITE_BASE_URL: https://ai-stack.site/
          BING_INDEXNOW_API_KEY: ${{ vars.BING_INDEXNOW_OWNERSHIP_KEY }}
          GOOGLE_INDEXING_API_KEY: ${{ secrets.GOOGLE_INDEXING_API_KEY }}
          GOOGLE_INDEXING_API_URL: ${{ secrets.GOOGLE_INDEXING_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$BING_INDEXNOW_API_KEY" && -z "$GOOGLE_INDEXING_API_KEY" ]]; then
            echo "Search index notification is not configured"
            exit 0
          fi
          python3 scripts/notify_search_engines.py
