name: Build and Deploy

on:
  schedule:
    # Avoid GitHub Actions' top-of-hour congestion window.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Crawl and regenerate Post-derived data before deploy"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main

concurrency:
  group: build-and-deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
  SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
  AI_STACK_RUNTIME_PROFILE: ci
  SITE_BASE_URL: https://ai-stack.site/
  SITEMAP_PATH: blog/public/sitemap.xml
  BING_INDEXNOW_API_KEY: ${{ secrets.BING_INDEXNOW_API_KEY }}
  BING_INDEXNOW_MAX_URLS: "80"
  GOOGLE_INDEXING_API_KEY: ${{ secrets.GOOGLE_INDEXING_API_KEY }}
  GOOGLE_INDEXING_API_URL: ${{ secrets.GOOGLE_INDEXING_API_URL }}
  AI_STACK_REFRESH_DATA: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data) }}

jobs:
  build-and-deploy:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run MiniMax response parsing tests
        run: |
          python3 -m unittest tests/test_anthropic_response_parsing.py

      - name: Run search fallback tests
        run: |
          python3 -m unittest tests/test_search_fallback.py

      - name: Install Playwright browsers
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        run: |
          if pip show playwright > /dev/null 2>&1; then
            playwright install chromium
            playwright install-deps chromium
          else
            echo "Playwright not found, skipping browser installation"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.153.4"
          extended: true

      - name: Run crawler
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: |
          echo "=== Generating Posts (crawl + process + write markdown, runtime_profile=${AI_STACK_RUNTIME_PROFILE}) ==="
          if [ -f scripts/generate_content.py ]; then
            python3 scripts/generate_content.py --dedupe-scope global --runtime-profile "${AI_STACK_RUNTIME_PROFILE}"
          else
            echo "Content generator not found, skipping..."
          fi

      - name: Moderation cleanup (LLM)
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' && env.AI_STACK_RUNTIME_PROFILE != 'ci' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          echo "=== Moderation Cleanup (scan newly changed posts) ==="
          if [ -z "${ANTHROPIC_AUTH_TOKEN}" ]; then
            echo "ANTHROPIC_AUTH_TOKEN not set, skipping moderation cleanup"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml

          from processor.anthropic_client import AnthropicClient
          from processor.ai_filter import AIThemeFilter

          def list_changed_posts() -> list[str]:
              out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
              paths: list[str] = []
              for line in out.splitlines():
                  if len(line) < 4:
                      continue
                  path = line[3:].strip()
                  if not path:
                      continue
                  if path.startswith("blog/content/posts/") and path.endswith(".md") and not path.endswith("/.gitkeep"):
                      paths.append(path)
              deduped: list[str] = []
              seen: set[str] = set()
              for p in paths:
                  if p in seen:
                      continue
                  seen.add(p)
                  deduped.append(p)
              return deduped

          def extract_frontmatter_and_body(path: Path) -> tuple[dict, str]:
              text = path.read_text(encoding="utf-8", errors="ignore")
              if not text.startswith("---"):
                  return {}, text
              parts = text.split("\n---\n", 1)
              if len(parts) != 2:
                  return {}, text
              fm_raw = parts[0].lstrip("-").strip("\n")
              body = parts[1]
              try:
                  fm = yaml.safe_load(fm_raw) or {}
                  if not isinstance(fm, dict):
                      fm = {}
              except Exception:
                  fm = {}
              return fm, body

          def looks_like_meta_disclaimer(t: str) -> bool:
              s = (t or "").strip()
              if not s:
                  return False
              banned = ["由于您提供", "仅为标题", "我将基于", "鉴于您提供", "无法从提供", "我无法从"]
              return any(b in s for b in banned)

          config_path = "config/anthropic.yaml"
          client = AnthropicClient(config_path)
          cfg = yaml.safe_load(Path(config_path).read_text(encoding="utf-8")) or {}
          ai_filter_cfg = ((cfg.get("anthropic") or {}).get("ai_filter") or {})
          flt = AIThemeFilter(client, ai_filter_cfg)

          changed = list_changed_posts()
          if not changed:
              print("No changed posts to moderate")
              raise SystemExit(0)

          deleted: list[str] = []
          for p in changed:
              path = Path(p)
              if not path.exists():
                  continue
              fm, body = extract_frontmatter_and_body(path)
              title = str(fm.get("title") or "").strip()
              description = str(fm.get("description") or "").strip()
              tags = fm.get("tags", [])
              categories = fm.get("categories", [])
              source = str(fm.get("source") or "").strip()
              external_url = str(fm.get("external_url") or fm.get("url") or "").strip()

              body_snippet = re.sub(r"\s+", " ", body.strip())[:900]
              if looks_like_meta_disclaimer(body_snippet):
                  deleted.append(p)
                  continue

              content = {
                  "source": source,
                  "title": title,
                  "catchy_title": title,
                  "description": description,
                  "summary": body_snippet,
                  "tags": tags if isinstance(tags, list) else [],
                  "categories": categories if isinstance(categories, list) else [],
                  "url": external_url,
              }

              content = flt.filter(content)
              content = flt.moderate(content)

              should_publish = bool(content.get("should_publish", True))
              ai_related = bool(content.get("ai_related", True))
              if (not should_publish) or (not ai_related):
                  deleted.append(p)

          if not deleted:
              print(f"Moderation OK: scanned={len(changed)} deleted=0")
              raise SystemExit(0)

          for p in deleted:
              proc = subprocess.run(["git", "rm", "-f", p], capture_output=True, text=True)
              if proc.returncode != 0:
                  try:
                      Path(p).unlink(missing_ok=True)
                  except Exception:
                      pass
          print(f"Moderation done: scanned={len(changed)} deleted={len(deleted)}")
          for p in deleted:
              print(f"- deleted {p}")
          PY

      - name: Sanitize broken relref links
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
        run: |
          echo "=== Sanitizing broken relref links ==="
          if [ -f scripts/generate_content.py ]; then
            python3 scripts/generate_content.py --sanitize-relrefs-only
          else
            echo "Content generator not found, skipping relref sanitization"
          fi

      - name: Build historical content quality manifest
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
        run: |
          python3 scripts/build_content_quality_manifest.py \
            --content-root blog/content \
            --output blog/data/content_quality.json \
            --fail-on-quarantine \
            --fail-on-structural-warning

      - name: Verify committed Post quality gate
        if: ${{ env.AI_STACK_REFRESH_DATA != 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
        run: |
          python3 scripts/build_content_quality_manifest.py \
            --content-root blog/content \
            --output /tmp/content_quality.json \
            --fail-on-quarantine \
            --fail-on-structural-warning
          cmp --silent blog/data/content_quality.json /tmp/content_quality.json

      - name: Build tag graph
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        env:
          PYTHONPATH: /home/runner/work/ai-stack/ai-stack
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          TAG_GRAPH_ENABLE_CONTENT_MINING: "0"
          TAG_INTRO_ENABLED: "0"
          TAG_INTRO_MAX_NEW: "0"
        run: |
          echo "=== Building Tag Graph ==="
          if [ -f processor/tag_graph.py ]; then
            python3 -m processor.tag_graph
          else
            echo "Tag graph generator not found"
            exit 1
          fi

      - name: Verify generated graph
        run: |
          if [ "${AI_STACK_REFRESH_DATA}" != "true" ]; then
            # Pushes and delete-triggered deploys reuse already-reviewed graph
            # assets and do not install Chromium. Validate every referenced file.
            python3 scripts/verify_graph.py --assets-only --public-dir blog/static
          else
            python3 scripts/verify_graph.py
          fi

      - name: Build Hugo site
        run: |
          echo "=== Building Hugo Site ==="
          if [ -f blog/config.toml ]; then
            cd blog
            hugo --baseURL "https://ai-stack.site/" --minify --cleanDestinationDir
          else
            echo "Hugo config not found, skipping build"
            exit 1
          fi

      - name: Build Pagefind search index and result catalog
        run: |
          echo "=== Building Pagefind Search ==="
          ./node_modules/.bin/pagefind --site blog/public
          python3 -m ai_stack.pagefind_catalog --public-root blog/public
          test -s blog/public/pagefind/pagefind.js
          test -s blog/public/pagefind/catalog.json
          test -s blog/public/pagefind/catalog.manifest.json

      - name: Commit generated data
        if: ${{ env.AI_STACK_REFRESH_DATA == 'true' }}
        run: |
          git add -A -- \
            blog/content/posts \
            blog/data/content_quality.json \
            blog/static/data/tag-graph
          if git diff --cached --quiet; then
            echo "No archive-new content or graph changes to commit"
            echo "- Generated data: no changes" >> "$GITHUB_STEP_SUMMARY"
          else
            changed_posts=$(git diff --cached --name-only --diff-filter=A -- blog/content/posts | wc -l | tr -d ' ')
            echo "- New posts: ${changed_posts}" >> "$GITHUB_STEP_SUMMARY"
            git commit -m "Update content and graph $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            # The publish artifact has already passed Hugo, Pagefind, catalog, and
            # graph validation. A concurrent human update must still fail closed.
            git push origin HEAD:main
          fi

      - name: Prepare IndexNow key file
        run: |
          if [ -n "${BING_INDEXNOW_API_KEY}" ]; then
            mkdir -p blog/public
            printf '%s' "${BING_INDEXNOW_API_KEY}" > "blog/public/${BING_INDEXNOW_API_KEY}.txt"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify search engines (IndexNow/Google)
        run: |
          if [ -f scripts/notify_search_engines.py ]; then
            python3 scripts/notify_search_engines.py || true
          fi
