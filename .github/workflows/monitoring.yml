name: System Monitoring & Content Quality Tracking

on:
  schedule:
    # 每小时错峰，避免整点调度拥塞。
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: production-release-monitor
  cancel-in-progress: true

permissions: {}

jobs:
  verify-production-state:
    name: Verify Production Release State
    runs-on: ubuntu-latest
    # Raised from 10 deliberately, and only here. Elsewhere a timeout should stay
    # tight so a slow checkout surfaces rather than being absorbed by a bigger
    # budget — but this job is the thing that reports a stall, and run
    # 30751525677 was already killed at 10m06s inside checkout, alerting nobody.
    # A monitor cannot report an outage that also kills the monitor.
    timeout-minutes: 20
    permissions:
      # Read-only view of workflow run history, to notice a broken release chain
      # in one cycle instead of waiting for staleness to show up downstream.
      actions: read
      contents: read
      # Alerts are delivered as Issues so GitHub itself pushes them to the owner
      # by email and in the app. A red Actions job was the only signal during the
      # 2026-07-30 outage, which is why it ran for four days unnoticed.
      issues: write
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          # Partial clone: full commit history is still required (build_lineage
          # and publish_heartbeat derive first-seen times from git log), but the
          # historical blobs are not. Fetching them made checkout exceed the job
          # timeout on a 4.1 GB repository and silently stranded generated posts.
          filter: blob:none

      # Runs first and independently of the release marker: nearly every failure
      # mode ends in "no new article", including the ones where every job is green.
      - name: Measure publication heartbeat
        id: heartbeat
        run: |
          # GitHub's default shell already sets -e, so a non-zero exit would
          # abort before the code is recorded and the delivery step would be
          # skipped — the check would detect the outage and tell no one.
          set -uo pipefail
          set +e
          python3 scripts/publish_heartbeat.py \
            --repository-root . \
            --summary-output "$RUNNER_TEMP/heartbeat.md"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 means the age could not be established at all. That must fail the
          # job rather than read as healthy.
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi

      - name: Deliver publication heartbeat alert
        if: always() && steps.heartbeat.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ steps.heartbeat.outputs.exit_code }}" = "0" ]; then
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key publish-heartbeat \
              --title "内容生产停滞：站点已停止产出新文章" \
              --resolved
          else
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key publish-heartbeat \
              --title "内容生产停滞：站点已停止产出新文章" \
              --failing \
              --summary-file "$RUNNER_TEMP/heartbeat.md" \
              --run-url "$RUN_URL"
          fi

      - name: Enforce divergence and stale thresholds
        id: release_state
        if: always()
        env:
          MAIN_SHA: ${{ github.sha }}
        run: |
          # GitHub's default shell already sets -e, so a non-zero exit would
          # abort before the code is recorded and the delivery step would be
          # skipped — the check would detect the outage and tell no one.
          set -uo pipefail
          set +e
          main_sha="$(git rev-parse HEAD)"
          main_committed_at="$(git show -s --format=%cI HEAD)"
          python3 scripts/production_monitor.py \
            --marker-url "https://ai-stack.site/ai_stack_release_v1.json" \
            --main-sha "$main_sha" \
            --main-committed-at "$main_committed_at" \
            --max-divergence-hours 3 \
            --max-stale-hours 12 \
            2> "$RUNNER_TEMP/release_state.err"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release_state.err" >&2 || true
          exit 0

      - name: Deliver release state alert
        if: always() && steps.release_state.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release_state.outputs.exit_code }}" = "0" ]; then
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key release-state \
              --title "生产发布状态异常" \
              --resolved
          else
            {
              echo "线上发布状态检查未通过。"
              echo
              echo '```'
              head -c 4000 "$RUNNER_TEMP/release_state.err" || true
              echo '```'
              echo
              echo "排查顺序：\`Build and Deploy\` 最近一次运行的 \`validate\` 阶段。"
            } > "$RUNNER_TEMP/release_state.md"
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key release-state \
              --title "生产发布状态异常" \
              --failing \
              --summary-file "$RUNNER_TEMP/release_state.md" \
              --run-url "$RUN_URL"
          fi

      # A cancelled run discards everything it generated and notifies nobody,
      # so it has to be caught here rather than hours later via staleness.
      - name: Check recent release runs
        id: release_runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's default shell already sets -e, so a non-zero exit would
          # abort before the code is recorded and the delivery step would be
          # skipped — the check would detect the outage and tell no one.
          set -uo pipefail
          set +e
          python3 scripts/check_release_runs.py \
            --repository "$GITHUB_REPOSITORY" \
            --summary-output "$RUNNER_TEMP/release_runs.md"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi

      - name: Deliver release run alert
        if: always() && steps.release_runs.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release_runs.outputs.exit_code }}" = "0" ]; then
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key release-runs \
              --title "发布链中断：定时运行连续未完成" \
              --resolved
          else
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key release-runs \
              --title "发布链中断：定时运行连续未完成" \
              --failing \
              --summary-file "$RUNNER_TEMP/release_runs.md" \
              --run-url "$RUN_URL"
          fi

      # Every release-blocking ceiling had exactly two states before this:
      # fine, and release fails. Grading them turns a capacity problem into
      # scheduled work rather than an outage.
      - name: Measure capacity headroom
        id: capacity
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # GitHub's default shell already sets -e, so a non-zero exit would
          # abort before the code is recorded and the delivery step would be
          # skipped — the check would detect the outage and tell no one.
          set -uo pipefail
          set +e
          python3 scripts/capacity_report.py \
            --summary-output "$RUNNER_TEMP/capacity.md" \
            --fail-on never > "$RUNNER_TEMP/capacity.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/capacity.json"
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
          # An unreadable report must alert rather than pass as healthy.
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' \
            < "$RUNNER_TEMP/capacity.json" 2>/dev/null || echo unreadable)"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Deliver capacity alert
        if: always() && steps.capacity.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status="${{ steps.capacity.outputs.status }}"
          if [ "$status" = "ok" ]; then
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key capacity-headroom \
              --title "容量水位接近上限" \
              --resolved
          else
            python3 scripts/ops_alert.py \
              --repository "$GITHUB_REPOSITORY" \
              --key capacity-headroom \
              --title "容量水位接近上限" \
              --failing \
              --summary-file "$RUNNER_TEMP/capacity.md" \
              --run-url "$RUN_URL"
          fi

      # The job's own colour still reflects reality, so a broken alert channel
      # cannot make a real outage look healthy.
      - name: Fail the job when production is unhealthy
        if: always()
        run: |
          set -euo pipefail
          heartbeat="${{ steps.heartbeat.outputs.exit_code }}"
          release_state="${{ steps.release_state.outputs.exit_code }}"
          release_runs="${{ steps.release_runs.outputs.exit_code }}"
          capacity="${{ steps.capacity.outputs.status }}"
          if [ "${heartbeat:-2}" != "0" ] \
            || [ "${release_state:-2}" != "0" ] \
            || [ "${release_runs:-2}" != "0" ]; then
            echo "production is unhealthy (heartbeat=${heartbeat:-unknown}" >&2
            echo " release_state=${release_state:-unknown} release_runs=${release_runs:-unknown})" >&2
            exit 1
          fi
          # A capacity warning is scheduled work, not an outage, so it alerts
          # without failing the job. Critical means a release is about to start
          # failing, and an unreadable report means the check itself is broken —
          # both have to show up in the job's colour.
          case "${capacity:-unreadable}" in
            ok|warning) ;;
            *)
              echo "capacity check is ${capacity:-unreadable}" >&2
              exit 1
              ;;
          esac
