name: System Monitoring & Content Quality Tracking

on:
  schedule:
    # Offset from the top of the hour to reduce delayed or dropped schedules.
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: content-freshness-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-data-freshness:
    name: Verify Repository and Production Data Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install trend verifier dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.1

      - name: Verify local and live graph freshness
        run: |
          python3 scripts/verify_content_freshness.py \
            --local-index blog/static/data/tag-graph/index.json \
            --live-index-url https://ai-stack.site/data/tag-graph/index.json \
            --max-age-hours 12

      - name: Verify local and live trend freshness
        run: |
          python3 scripts/verify_stack_trends.py \
            --root blog/static/data/stack-trends \
            --verify-hashes
          python3 scripts/verify_stack_trends_live.py \
            --live-index-url https://ai-stack.site/data/stack-trends/index.json \
            --max-age-hours 12
