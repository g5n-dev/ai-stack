name: System Monitoring & Content Quality Tracking

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-monitoring
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: production-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitoring code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify protected ledger refs exist
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code "https://github.com/${REPOSITORY}.git" refs/heads/main
          git ls-remote --exit-code "https://github.com/${REPOSITORY}.git" refs/heads/content
          git ls-remote --exit-code "https://github.com/${REPOSITORY}.git" refs/heads/ops

      - name: Verify production manifest and immutable release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            --output /tmp/manifest.json \
            https://ai-stack.site/api/v1/manifest.json
          python3 - <<'PY'
          import json
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from urllib.request import urlopen

          root = json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          release = root.get("active_release")
          cutoff = root.get("data_as_of")
          if not isinstance(release, str) or not release:
              raise SystemExit("missing active_release")
          if root.get("realtime") is not False:
              raise SystemExit("manifest must explicitly say realtime=false")
          parsed = datetime.fromisoformat(str(cutoff).replace("Z", "+00:00"))
          if parsed < datetime.now(UTC) - timedelta(hours=8):
              raise SystemExit(f"data is stale: {cutoff}")
          url = f"https://ai-stack.site/api/v1/releases/{release}/manifest.json"
          with urlopen(url, timeout=20) as response:
              immutable = json.load(response)
          if immutable.get("release_id") != release:
              raise SystemExit("root and immutable release disagree")
          print(json.dumps({"release_id": release, "data_as_of": cutoff}, sort_keys=True))
          PY

      - name: Publish factual summary
        if: always()
        run: |
          {
            echo "## Production monitoring"
            echo "- Run: ${{ github.run_id }}"
            echo "- Result: ${{ job.status }}"
            echo "- Checked: branch refs, root manifest, immutable release, freshness"
          } >> "$GITHUB_STEP_SUMMARY"
