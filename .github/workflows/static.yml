- name: Setup Hugo
  uses: peaceiris/actions-hugo@v2
  with:
    hugo-version: 'latest'
    extended: true
- name: Build Hugo site
  run: |
    cd blog
    hugo --minify --cleanDestinationDir
- name: Upload artifact
  uses: actions/upload-pages-artifact@v3
  with:
    path: 'blog/public'  # 改为上传 Hugo 构建后的目录
