# Crawler sources configuration
sources:
  github_trending:
    enabled: true
    period: daily
    language: all
    limit: 10
    spoken_language_code: "zh"
    since: "daily"

  hacker_news:
    enabled: true
    limit: 20
    url: "https://hacker-news.firebaseio.com/v0/topstories.json"

  arxiv_ai:
    enabled: true
    categories:
      - "cs.AI"
      - "cs.LG"
      - "cs.CL"
      - "cs.NE"
    limit: 10
    sort_by: "submittedDate"

  juejin:
    enabled: true
    tags:
      - "人工智能"
      - "机器学习"
      - "深度学习"
      - "大模型"
      - "AI"
    limit: 5
    rss_url: "https://juejin.cn/rss/backend"

  # "大佬" 博客 / 播客（RSS/Atom 聚合）
  blogs_podcasts:
    enabled: true
    limit: 10
    timeout: 30
    # 可按需增删 / 替换为你自己的订阅源
    feeds:
      - name: "Andrej Karpathy Blog"
        url: "https://karpathy.github.io/feed.xml"
        type: "blog"
      - name: "Lilian Weng (Lil'Log)"
        url: "https://lilianweng.github.io/lil-log/feed.xml"
        type: "blog"
      - name: "Jay Alammar"
        url: "https://jalammar.github.io/feed.xml"
        type: "blog"
      - name: "Colah's Blog"
        url: "https://colah.github.io/rss.xml"
        type: "blog"
      - name: "OpenAI Blog"
        url: "https://openai.com/blog/rss.xml"
        type: "blog"
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
        type: "blog"
      - name: "Latent Space"
        url: "https://www.latent.space/feed"
        type: "blog"
      - name: "The Gradient"
        url: "https://thegradient.pub/feed/"
        type: "blog"
      - name: "Import AI (Jack Clark)"
        url: "https://importai.substack.com/feed"
        type: "blog"
      - name: "Lex Fridman Podcast"
        url: "https://lexfridman.com/feed/podcast/"
        type: "podcast"

  # Twitter/X 科技大佬推文（使用 Playwright 爬取，不需要 API）
  twitter:
    enabled: true
    headless: true
    accounts:
      - "elonmusk"
      - "sama"
      - "ylecun"
      - "AndrewYNg"
      - "hardmaru"
      - "fchollet"
      - "karpathy"
      - "OpenAI"
