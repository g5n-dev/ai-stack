<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="g" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4db6ac" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#0a111a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#060a14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4db6ac" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#4db6ac" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4db6ac" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#g)"/>

  <!-- subtle grid -->
  <g opacity="0.45">
    <g stroke="#4db6ac" stroke-opacity="0.12" stroke-width="1">
      <!-- vertical -->
      <path d="M80 0V1000"/><path d="M160 0V1000"/><path d="M240 0V1000"/><path d="M320 0V1000"/>
      <path d="M400 0V1000"/><path d="M480 0V1000"/><path d="M560 0V1000"/><path d="M640 0V1000"/><path d="M720 0V1000"/>
      <!-- horizontal -->
      <path d="M0 100H800"/><path d="M0 200H800"/><path d="M0 300H800"/><path d="M0 400H800"/>
      <path d="M0 500H800"/><path d="M0 600H800"/><path d="M0 700H800"/><path d="M0 800H800"/><path d="M0 900H800"/>
    </g>
  </g>

  <!-- hologram silhouette -->
  <g transform="translate(0,20)">
    <circle cx="400" cy="330" r="160" fill="#4db6ac" fill-opacity="0.08" stroke="#4db6ac" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M250 820c10-130 90-240 150-240h0c60 0 140 110 150 240" fill="#4db6ac" fill-opacity="0.06" stroke="#4db6ac" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M280 820c25-85 85-150 120-150h0c35 0 95 65 120 150" fill="none" stroke="#4db6ac" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M340 680c10-30 30-50 60-50s50 20 60 50" fill="none" stroke="#4db6ac" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- scanlines -->
  <g opacity="0.12">
    <rect x="0" y="0" width="800" height="1000" fill="url(#grid)"/>
    <g fill="#000" fill-opacity="0.12">
      <rect x="0" y="0" width="800" height="2"/>
      <rect x="0" y="4" width="800" height="2"/>
      <rect x="0" y="8" width="800" height="2"/>
      <rect x="0" y="12" width="800" height="2"/>
    </g>
  </g>

  <!-- glow corner -->
  <circle cx="120" cy="140" r="110" fill="#4db6ac" opacity="0.08" filter="url(#blur)"/>
  <circle cx="690" cy="870" r="140" fill="#d97706" opacity="0.06" filter="url(#blur)"/>
</svg>

