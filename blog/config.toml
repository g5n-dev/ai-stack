# Hugo 配置文件 - AI Stack 个人博客

baseURL = "https://ai-stack.site/"
languageCode = "zh-CN"
title = "AI Stack"
theme = "terminal-theme"
enableRobotsTXT = true

[params]
# 站点信息
description = "探索 AI 技术前沿，分享深度思考与实践"
author = "AI Stack"
github = "https://github.com/g5n-dev"

# 个人头像（用于 /about/）
# 建议把你的头像图放到 blog/static/img/profile.png（或 profile.jpg），然后改成对应路径。
# 如果你要用“全息/故障风”头像（你发的那张蓝色线框），直接保存为 blog/static/img/profile-holo.png，
# 然后把 profile_image 改成 "/img/profile-holo.png"。
profile_image = "/img/profile-holo.png"
default_og_image = "/img/profile-holo.png"
profile_image_alt = "AI Stack profile"
# 头像裁切/适配：cover=铺满（会裁边），contain=完整显示（可能留黑边）
profile_image_fit = "contain"
# 头像在框里的位置（CSS background-position），默认 50% 35% 更适合人像
profile_image_position = "50% 50%"

# 终端风格设置（可选）
terminal = false
prompt = "➜"
cursor = false
typing_effect = false

# 社交媒体
twitter = ""
telegram = ""

# 分页
paginate = 10
paginatePath = "page"

[params.comments]
enabled = false
provider = "utterances"   # GitHub Issues
repo = "g5n-dev/ai-stack"
issue_term = "pathname"
theme = "github-dark"
label = "comment"

[markup]
[markup.highlight]
style = "monokai"
lineNos = true
lineNumbersInTable = true
noClasses = false

[markup.goldmark.renderer]
unsafe = false

[taxonomies]
tag = "tags"
category = "categories"
scenario = "scenarios"

[permalinks]
post = "/:year/:month/:slug/"

[sitemap]
changefreq = "hourly"
filename = "sitemap.xml"
priority = 0.5

[menu]
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "归档"
url = "/posts/"
weight = 2

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 3

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 4

[[menu.main]]
name = "趋势"
url = "/trends/"
weight = 5

[[menu.main]]
name = "AI史塔克"
url = "/scenarios/"
weight = 6

[[menu.main]]
name = "关于"
url = "/about/"
weight = 7

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[services.rss]
limit = 50
