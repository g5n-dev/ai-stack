# Hugo 配置文件 - AI Stack 个人博客

baseURL = "https://ai-stack.site/"
languageCode = "zh-CN"
title = "AI 探索者"
theme = "terminal-theme"

[params]
  # 站点信息
  description = "探索 AI 技术前沿，分享深度思考与实践"
  author = "AI Explorer"
  github = "https://github.com/g5n-dev/ai-stack"

  # 终端风格设置（可选）
  terminal = false
  prompt = "➜"
  cursor = false
  typing_effect = false

  # 社交媒体
  twitter = ""
  telegram = ""

  # 分页
  paginate = 10
  paginatePath = "page"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true
    noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  post = "/:year/:month/:slug/"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "归档"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3

  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 4

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
