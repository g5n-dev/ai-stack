{{- with .Taxonomies.scenarios }}
<div class="site-panel">
    <h3 class="site-panel__heading">应用场景</h3>
    <div class="site-panel__body flex flex-wrap gap-2">
        {{- range .Alphabetical }}
        <a href="{{ .Page.RelPermalink }}"
            class="site-control-text scenario-tag flex min-h-11 items-center rounded border border-primary/15 bg-primary/5 px-3 text-primary/70 transition-colors hover:bg-primary/10"
            title="{{ len .Pages }} 个项目">
            {{ .Term }}
        </a>
        {{- end }}
    </div>
</div>
{{- end }}
