<!DOCTYPE html>
<html class="dark" lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; form-action 'self'; upgrade-insecure-requests" />
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description | default .Site.Params.description }}" />
    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen bg-deep-navy font-display text-off-white selection:bg-muted-teal selection:text-deep-navy">
    <a href="#search-query"
        class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-off-white focus:px-4 focus:py-2 focus:text-deep-navy">
        跳到搜索
    </a>

    <header class="border-b border-muted-teal/10 bg-deep-navy/95">
        <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-6 px-6 py-5">
            <a href="/" class="font-mono text-sm font-bold tracking-wide text-primary">AI_STACK://SEARCH</a>
            <nav aria-label="主导航" class="flex flex-wrap items-center justify-end gap-4 text-sm text-off-white/70">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" class="hover:text-primary focus:text-primary">{{ .Name }}</a>
                {{ end }}
            </nav>
        </div>
    </header>

    <main id="main-content" class="mx-auto w-full max-w-6xl px-6 py-10">
        <div class="mb-8 border-l-2 border-primary/60 pl-5">
            <p class="mb-2 font-mono text-xs tracking-wide text-primary">STATIC_INDEX / PAGEFIND_V1</p>
            <h1 class="text-3xl font-light tracking-tight text-off-white md:text-5xl">检索情报归档</h1>
            <p class="mt-3 max-w-3xl text-sm leading-relaxed text-off-white/60">
                标题和正文参与全文检索；来源、日期、规范实体、标签与场景使用精确过滤。索引随静态站点构建，不宣称实时。
            </p>
        </div>

        <form id="search-form" role="search" aria-describedby="search-help search-status"
            class="terminal-glass rounded-2xl border border-muted-teal/20 p-5 md:p-7">
            <fieldset>
                <legend class="sr-only">搜索条件</legend>
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3">
                    <div class="md:col-span-2 lg:col-span-3">
                        <label for="search-query" class="mb-2 block text-sm font-medium text-off-white">关键词</label>
                        <input id="search-query" name="query" type="search" autocomplete="off" maxlength="200"
                            aria-controls="search-results" placeholder="搜索标题与正文"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white placeholder:text-off-white/30 focus:border-primary focus:ring-primary" />
                    </div>

                    <div>
                        <label for="search-source" class="mb-2 block text-xs font-mono text-muted-teal">来源</label>
                        <select id="search-source" name="source"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white focus:border-primary focus:ring-primary">
                            <option value="">全部来源</option>
                        </select>
                    </div>
                    <div>
                        <label for="search-date" class="mb-2 block text-xs font-mono text-muted-teal">日期</label>
                        <input id="search-date" name="date" type="date"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white focus:border-primary focus:ring-primary" />
                    </div>
                    <div>
                        <label for="search-entity" class="mb-2 block text-xs font-mono text-muted-teal">规范实体 ID</label>
                        <input id="search-entity" name="entity" type="text" list="search-entities" maxlength="200"
                            autocomplete="off" placeholder="例如 entity-openai"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white placeholder:text-off-white/30 focus:border-primary focus:ring-primary" />
                        <datalist id="search-entities"></datalist>
                    </div>
                    <div>
                        <label for="search-tag" class="mb-2 block text-xs font-mono text-muted-teal">标签</label>
                        <input id="search-tag" name="tag" type="text" list="search-tags" maxlength="200"
                            autocomplete="off" placeholder="输入或选择标签"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white placeholder:text-off-white/30 focus:border-primary focus:ring-primary" />
                        <datalist id="search-tags"></datalist>
                    </div>
                    <div>
                        <label for="search-scenario" class="mb-2 block text-xs font-mono text-muted-teal">场景</label>
                        <input id="search-scenario" name="scenario" type="text" list="search-scenarios" maxlength="200"
                            autocomplete="off" placeholder="输入或选择场景"
                            class="w-full rounded-lg border-muted-teal/30 bg-terminal-bg text-off-white placeholder:text-off-white/30 focus:border-primary focus:ring-primary" />
                        <datalist id="search-scenarios"></datalist>
                    </div>
                </div>
            </fieldset>

            <p id="search-help" class="mt-5 text-xs leading-relaxed text-off-white/70">
                实体过滤只接受账本中的稳定 entity_id；过滤值为精确匹配。
            </p>
            <div class="mt-5 flex flex-wrap gap-3">
                <button id="search-submit" type="submit"
                    class="rounded-lg border border-primary/40 bg-primary/10 px-5 py-2.5 text-sm font-medium text-primary hover:bg-primary/20 focus:ring-2 focus:ring-primary">
                    搜索
                </button>
                <button type="reset"
                    class="rounded-lg border border-muted-teal/20 px-5 py-2.5 text-sm text-off-white/70 hover:bg-muted-teal/10 focus:ring-2 focus:ring-primary">
                    清除
                </button>
            </div>
        </form>

        <section aria-labelledby="search-results-heading" class="mt-10">
            <h2 id="search-results-heading" class="text-xl font-medium text-off-white">搜索结果</h2>
            <p id="search-status" role="status" aria-live="polite" aria-atomic="true"
                class="mt-2 min-h-5 text-sm text-muted-teal">输入关键词或至少选择一个过滤条件。</p>
            <ol id="search-results" class="mt-5 grid list-none gap-4" aria-label="搜索结果列表"></ol>
            <noscript>
                <p class="mt-5 rounded-lg border border-amber-500/30 bg-amber-500/10 p-4 text-sm text-amber-200">
                    静态搜索需要启用 JavaScript；归档和 RSS 在禁用 JavaScript 时仍可使用。
                </p>
            </noscript>
        </section>
    </main>

    <script src="/js/search.js" defer></script>
</body>
</html>
